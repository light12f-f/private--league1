
<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Private League V2</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#07150f;--panel:#10251a;--line:#294936;--green:#42d392;--lime:#b4ef68;--txt:#f2faf5;--muted:#9db5a7}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 80% 0,#1b4930,transparent 35%),var(--bg);color:var(--txt);font-family:Tahoma,Arial,sans-serif}
.wrap{max-width:1050px;margin:auto;padding:18px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0}
.center{max-width:420px;margin:9vh auto}
.brand{font-size:23px;font-weight:bold;color:var(--lime)}
p,.muted{color:var(--muted);font-size:13px}
input,button,select{font:inherit;border-radius:10px;padding:11px;border:1px solid var(--line)}
input,select{background:#091a11;color:white;width:100%;margin:6px 0 12px}
button{background:var(--green);color:#062015;font-weight:bold;cursor:pointer}
button.alt{background:#244333;color:white}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}
.tabs button{background:#193727;color:white}
.tabs button.active{background:var(--green);color:#062015}
.hidden{display:none!important}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
.stat{background:#173324;padding:14px;border-radius:12px}
.stat b{display:block;color:var(--lime);font-size:24px;margin-top:6px}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{padding:10px 6px;text-align:center;border-bottom:1px solid var(--line)}
th{color:var(--muted)}
td:first-child,th:first-child{text-align:right}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row>*{flex:1;min-width:0}
h2{font-size:19px}
.notice{padding:10px;border-radius:10px;background:#1c3928;color:#d2f5dc;font-size:12px}
</style>
</head>
<body>
<main class="wrap">

<section id="login" class="panel center">
<div class="brand">⚽ Private League</div>
<p>منصة البطولة الخاصة</p>

<label>البريد الإلكتروني</label>
<input id="email" type="email" placeholder="admin@league.local" autocomplete="username">

<label>كلمة المرور</label>
<input id="password" type="password" placeholder="كلمة المرور" autocomplete="current-password">

<button style="width:100%" onclick="login()">دخول</button>
<p id="loginMsg"></p>
<p class="muted">الإدارة والمشجع لكل واحد حساب مستقل.</p>
</section>

<section id="app" class="hidden">

<header class="row">
<div>
<div class="brand">⚽ Private League</div>
<p id="roleLabel"></p>
</div>
<button class="alt" onclick="logout()">تسجيل الخروج</button>
</header>

<div class="tabs">
<button class="active" onclick="tab('home',this)">الرئيسية</button>
<button onclick="tab('standings',this)">الترتيب</button>
<button onclick="tab('matches',this)">المباريات</button>
<button onclick="tab('teams',this)">الفرق واللاعبون</button>
<button id="adminTab" onclick="tab('admin',this)">الإدارة</button>
</div>

<div id="home" class="page">
<div class="panel">
<h2>ملخص البطولة</h2>
<div class="grid" id="summary"></div>
</div>
<div class="panel">
<h2>آخر النتائج</h2>
<div id="recent"></div>
</div>
</div>

<div id="standings" class="page hidden panel">
<h2>جدول الترتيب</h2>
<div id="table"></div>
</div>

<div id="matches" class="page hidden panel">
<h2>برنامج المباريات</h2>
<div id="matchList"></div>
</div>

<div id="teams" class="page hidden panel">
<h2>الفرق واللاعبون</h2>
<div id="teamList"></div>
</div>

<div id="admin" class="page hidden">
<div class="notice">أدوات الإدارة. قاعدة البيانات هي التي تتحكم في صلاحيات التعديل.</div>

<div class="panel">
<h2>تعديل أسماء الفرق</h2>
<div id="teamEdit"></div>
<button onclick="saveTeams()">حفظ الفرق</button>
</div>

<div class="panel">
<h2>إضافة لاعب</h2>
<div class="row">
<input id="pname" placeholder="اسم اللاعب">
<input id="ppos" placeholder="المركز">
<select id="pteam"></select>
<button onclick="addPlayer()">إضافة</button>
</div>
</div>

<div class="panel">
<h2>تسجيل نتيجة</h2>
<div class="row">
<select id="matchSelect"></select>
<input id="hg" type="number" min="0" placeholder="أهداف صاحب الأرض">
<input id="ag" type="number" min="0" placeholder="أهداف الضيف">
<button onclick="saveResult()">حفظ</button>
</div>
</div>
</div>

</section>
</main>

<script>
const SUPABASE_URL="https://ejaideqlpjkqipuktpkl.supabase.co";
const SUPABASE_ANON_KEY="sb_publishable_u7Yhh5ZCshuD6DULTrio_A_WgbsFxUL";

let sb=null;
let role=null;
let teams=[];
let matches=[];
let players=[];

function msg(t){
document.getElementById('loginMsg').textContent=t;
}

async function login(){
if(!window.supabase){
msg('تعذر تحميل مكتبة الاتصال. تحقق من الإنترنت.');
return;
}

sb=window.supabase.createClient(
SUPABASE_URL,
SUPABASE_ANON_KEY
);

const email=document.getElementById('email').value.trim();
const password=document.getElementById('password').value;

if(!email||!password){
msg('دخل البريد الإلكتروني وكلمة المرور.');
return;
}

msg('جاري التحقق من الحساب...');

const {data,error}=await sb.auth.signInWithPassword({
email:email,
password:password
});

if(error){
msg('فشل الدخول: '+error.message);
return;
}

const {data:profile,error:profileError}=await sb
.from('profiles')
.select('role')
.eq('id',data.user.id)
.single();

if(profileError){
await sb.auth.signOut();
msg('تعذر العثور على صلاحية الحساب: '+profileError.message);
return;
}

role=profile.role;

if(!['admin','viewer'].includes(role)){
await sb.auth.signOut();
msg('هذا الحساب غير مفعل.');
return;
}

document.getElementById('login').classList.add('hidden');
document.getElementById('app').classList.remove('hidden');

document.getElementById('roleLabel').textContent=
role==='admin'?'صلاحية المسؤول':'صلاحية المشاهدة فقط';

document.getElementById('adminTab').classList.toggle(
'hidden',role!=='admin'
);

await loadAll();
}

async function logout(){
if(sb) await sb.auth.signOut();
location.reload();
}

function tab(id,b){
document.querySelectorAll('.page').forEach(x=>x.classList.add('hidden'));
document.getElementById(id).classList.remove('hidden');
document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));
b.classList.add('active');
}

async function loadAll(){
const a=await sb.from('teams').select('*').order('id');
const b=await sb.from('matches').select('*').order('round').order('id');
const c=await sb.from('players').select('*').order('name');

if(a.error||b.error||c.error){
alert('تعذر تحميل البيانات: '+(a.error?.message||b.error?.message||c.error?.message));
return;
}

teams=a.data;
matches=b.data;
players=c.data;

render();
}

function teamName(id){
return teams.find(t=>t.id===id)?.name||'فريق';
}

function standings(){
return teams.map(t=>{
let ms=matches.filter(m=>
m.status==='played'&&(m.home_team===t.id||m.away_team===t.id)
);

let w=0,d=0,l=0,gf=0,ga=0;

ms.forEach(m=>{
let home=m.home_team===t.id;
let f=home?m.home_score:m.away_score;
let a=home?m.away_score:m.home_score;

gf+=f;
ga+=a;

if(f>a)w++;
else if(f===a)d++;
else l++;
});

return {...t,p:ms.length,w,d,l,gf,ga,gd:gf-ga,pts:w*3+d};

}).sort((a,b)=>b.pts-a.pts||b.gd-a.gd||b.gf-a.gf);
}

function render(){
let s=standings();
let played=matches.filter(m=>m.status==='played').length;

document.getElementById('summary').innerHTML=[
['الفرق',teams.length],
['المباريات الملعوبة',played],
['المتبقية',matches.length-played],
['الأهداف',matches.filter(m=>m.status==='played').reduce((n,m)=>n+m.home_score+m.away_score,0)]
].map(x=>`<div class="stat">${x[0]}<b>${x[1]}</b></div>`).join('');

document.getElementById('table').innerHTML=`
<div style="overflow:auto">
<table>
<tr><th>الفريق</th><th>لعب</th><th>ف</th><th>ت</th><th>خ</th><th>له</th><th>عليه</th><th>النقاط</th></tr>
${s.map(t=>`
<tr>
<td>${t.name}</td><td>${t.p}</td><td>${t.w}</td>
<td>${t.d}</td><td>${t.l}</td><td>${t.gf}</td>
<td>${t.ga}</td><td><b>${t.pts}</b></td>
</tr>`).join('')}
</table>
</div>`;

const matchHtml=m=>`
<div class="row" style="padding:10px;border-bottom:1px solid #294936">
<span>${teamName(m.home_team)}</span>
<b>${m.status==='played'?m.home_score+' - '+m.away_score:'لم تلعب بعد'}</b>
<span>${teamName(m.away_team)}</span>
<small>الجولة ${m.round}</small>
</div>`;

document.getElementById('recent').innerHTML=
matches.filter(m=>m.status==='played').slice(-5).reverse().map(matchHtml).join('')
||'لا توجد نتائج مسجلة';

document.getElementById('matchList').innerHTML=
matches.map(matchHtml).join('');

document.getElementById('teamList').innerHTML=
teams.map(t=>`
<div class="panel">
<b>${t.name}</b>
<p>${players.filter(p=>p.team_id===t.id).map(p=>p.name+' · '+(p.position||'')).join('، ')||'لاعبون لم يضافوا بعد'}</p>
</div>`).join('');

if(role==='admin'){
document.getElementById('teamEdit').innerHTML=
teams.map(t=>`
<label>${t.name}</label>
<input data-team="${t.id}" value="${t.name}">
`).join('');

document.getElementById('pteam').innerHTML=
teams.map(t=>`<option value="${t.id}">${t.name}</option>`).join('');

document.getElementById('matchSelect').innerHTML=
matches.filter(m=>m.status!=='played').map(m=>`
<option value="${m.id}">
${teamName(m.home_team)} × ${teamName(m.away_team)} · ج${m.round}
</option>`).join('');
}
}

async function saveTeams(){
for(let el of document.querySelectorAll('[data-team]')){
let {error}=await sb.from('teams')
.update({name:el.value})
.eq('id',el.dataset.team);

if(error)return alert('فشل حفظ اسم الفريق: '+error.message);
}
await loadAll();
alert('تم الحفظ');
}

async function addPlayer(){
let name=document.getElementById('pname').value.trim();

if(!name)return alert('أدخل اسم اللاعب');

let {error}=await sb.from('players').insert({
name:name,
position:document.getElementById('ppos').value,
team_id:+document.getElementById('pteam').value
});

if(error)return alert(error.message);

document.getElementById('pname').value='';
await loadAll();
}

async function saveResult(){
let id=+document.getElementById('matchSelect').value;

if(!id)return alert('لا توجد مباراة متاحة');

let {error}=await sb.from('matches').update({
home_score:+document.getElementById('hg').value,
away_score:+document.getElementById('ag').value,
status:'played'
}).eq('id',id);

if(error)return alert(error.message);

await loadAll();
alert('تم تحديث النتيجة والترتيب');
}
</script>
</body>
</html>
